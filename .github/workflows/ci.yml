name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  i18n-validate:
    name: Locale validation (fa/en parity, JSON, placeholders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node packages/i18n/scripts/validate-locales.js

  build:
    name: Build all workspaces
    runs-on: ubuntu-latest
    needs: i18n-validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run build --if-present
