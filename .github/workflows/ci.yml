name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-validate:
    name: Locale validation (fa/en parity, JSON, placeholders)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run i18n:validate

  build:
    name: Build all workspaces
    runs-on: ubuntu-latest
    needs: i18n-validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Validate Prisma schema
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/molido_ci
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Build all workspaces
        run: npm run build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
