name: Temporary dependency lock refresh

on:
  push:
    branches: [fix/ci-prisma-client-generation]

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/ci-prisma-client-generation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply non-breaking security updates
        run: npm audit fix
        continue-on-error: true
      - name: Upgrade vulnerable direct dependencies to patched major versions
        run: |
          npm install --workspace=@molido/backend zod@^4.6.6 --save
          npm install --workspace=@molido/frontend vite@^6.4.4 --save-dev
      - name: Clean install, compile and audit
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/backend/package.json apps/frontend/package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch audited dependency vulnerabilities"
            git push origin HEAD:fix/ci-prisma-client-generation
          fi
