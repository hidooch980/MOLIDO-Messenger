name: Temporary dependency lock refresh

on:
  push:
    branches: [fix/ci-prisma-client-generation]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply non-breaking security updates
        run: npm audit fix
        continue-on-error: true
      - name: Upgrade vulnerable direct dependencies to patched major versions
        run: |
          npm install --workspace=@molido/backend zod@^4.6.6 --save
          npm install --workspace=@molido/frontend vite@^6.4.4 --save-dev
      - name: Clean install and compile
        run: |
          npm ci
          npm run build
      - name: Verify security audit
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refreshed-dependencies
          path: |
            package.json
            package-lock.json
            apps/backend/package.json
            apps/frontend/package.json
